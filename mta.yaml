_schema-version: 3.3.0
ID: prototype_salesorderApp_ai
description: A simple CAP project.
version: 1.0.0
modules:
- name: prototype_salesorderApp_ai-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: prototype_salesorderApp_ai-auth
  - name: prototype_salesorderApp_ai-db
  - name: prototype_salesorderApp_ai-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: prototype_salesorderApp_ai-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: prototype_salesorderApp_ai-db
  parameters:
    buildpack: nodejs_buildpack
- name: prototype_salesorderApp_ai-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: prototype_salesorderApp_ai-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comprototypesalesorderaisalesorderui.zip
      name: comprototypesalesorderaisalesorderui
      target-path: resources/
- name: comprototypesalesorderaisalesorderui
  type: html5
  path: app/salesorderui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: prototype_salesorderApp_ai-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      role-collections:
      - description: generated
        name: admin (prototype_salesorderApp_ai ${org}-${space})
        role-template-references:
        - $XSAPPNAME.admin
      tenant-mode: dedicated
      xsappname: prototype_salesorderApp_ai-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: prototype_salesorderApp_ai-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: prototype_salesorderApp_ai-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: prototype_salesorderApp_ai-html5-service
    service-plan: app-host
- name: prototype_salesorderApp_ai-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            Name: SAP_Sales_Cloud_V1
            ProxyType: Internet
            Type: HTTP
            URL: https://my347080.crm.ondemand.com/sap/c4c/odata/v1/c4codataapi
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: prototype_salesorderApp_ai-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
