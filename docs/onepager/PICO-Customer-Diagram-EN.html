<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PICO – What does the AI do, and what does it not?</title>
<style>
@page { size: A4 landscape; margin: 0; }
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:#2b2340}

<div class="page">
<h1>PICO: How your voice becomes a sales order</h1>
<div class="sub">Example: “Add 5 of Product A and 10 of Product B” – where does the AI work, where does classic software work, where does the human decide?</div>

<svg viewBox="0 0 1100 610" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="k" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a6180"/></marker>
<marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker>
</defs>

<rect x="0" y="0" width="22" height="22" rx="5" fill="#8E44AD"/><text x="30" y="16" font-size="13" font-weight="600">AI (language models)</text>
<rect x="230" y="0" width="22" height="22" rx="5" fill="#2a8f6a"/><text x="260" y="16" font-size="13" font-weight="600">Classic software &amp; data (rule-based)</text>
<rect x="590" y="0" width="22" height="22" rx="5" fill="#e08a00"/><text x="620" y="16" font-size="13" font-weight="600">Human</text>

<g transform="translate(0,45)">
<rect width="160" height="250" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<rect width="160" height="38" rx="12" fill="#e08a00"/><rect y="20" width="160" height="18" fill="#e08a00"/>
<text x="80" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1 · Speak</text>
<text x="80" y="70" font-size="34" text-anchor="middle">🎤</text>
<text x="80" y="110" font-size="12" text-anchor="middle">The sales rep</text>
<text x="80" y="127" font-size="12" text-anchor="middle">speaks or types</text>
<text x="80" y="144" font-size="12" text-anchor="middle">their request in the</text>
<text x="80" y="161" font-size="12" text-anchor="middle">browser (Fiori).</text>
<text x="80" y="205" font-size="11" fill="#7a5a10" text-anchor="middle">Microphone &amp; UI:</text>
<text x="80" y="221" font-size="11" fill="#7a5a10" text-anchor="middle">no AI credentials</text>
</g>

<g transform="translate(185,45)">
<rect width="160" height="250" rx="12" fill="#f4e9fa" stroke="#8E44AD" stroke-width="2"/>
<rect width="160" height="38" rx="12" fill="#8E44AD"/><rect y="20" width="160" height="18" fill="#8E44AD"/>
<text x="80" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2 · Speech → text</text>
<text x="80" y="70" font-size="34" text-anchor="middle">👂</text>
<text x="80" y="110" font-size="12" text-anchor="middle">Speech recognition turns</text>
<text x="80" y="127" font-size="12" text-anchor="middle">what was said into text</text>
<text x="80" y="144" font-size="12" text-anchor="middle">(German &amp; English).</text>
<text x="80" y="188" font-size="11" font-weight="700" fill="#5b2a86" text-anchor="middle">AI: speech recognition</text>
<text x="80" y="205" font-size="11" fill="#5b2a86" text-anchor="middle">only the “ear” – evaluates nothing,</text>
<text x="80" y="221" font-size="11" fill="#5b2a86" text-anchor="middle">does not answer itself</text>
</g>

<g transform="translate(370,45)">
<rect width="160" height="250" rx="12" fill="#f4e9fa" stroke="#8E44AD" stroke-width="2"/>
<rect width="160" height="38" rx="12" fill="#8E44AD"/><rect y="20" width="160" height="18" fill="#8E44AD"/>
<text x="80" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3 · Detect intent</text>
<text x="80" y="70" font-size="34" text-anchor="middle">🧭</text>
<text x="80" y="110" font-size="12" text-anchor="middle">The AI decides what is</text>
<text x="80" y="127" font-size="12" text-anchor="middle">wanted – exactly one</text>
<text x="80" y="144" font-size="12" text-anchor="middle">of six functions.</text>
<text x="80" y="161" font-size="12" text-anchor="middle">Unclear? It asks.</text>
<text x="80" y="205" font-size="11" font-weight="700" fill="#5b2a86" text-anchor="middle">AI: language understanding</text>
<text x="80" y="221" font-size="11" fill="#5b2a86" text-anchor="middle">(Routing)</text>
</g>

<g transform="translate(555,45)">
<rect width="250" height="250" rx="12" fill="#fff" stroke="#6a6180" stroke-width="2"/>
<rect width="250" height="38" rx="12" fill="#6a6180"/><rect y="20" width="250" height="18" fill="#6a6180"/>
<text x="125" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4 · Run the function</text>
<rect x="10" y="48" width="230" height="92" rx="8" fill="#f4e9fa" stroke="#8E44AD"/>
<text x="20" y="67" font-size="12" font-weight="700" fill="#5b2a86">Here the AI helps understand:</text>
<text x="20" y="85" font-size="11.5">• Recognize products &amp; quantities</text>
<text x="20" y="101" font-size="11.5">   (unclear → follow-up question)</text>
<text x="20" y="118" font-size="11.5">• Find customers by name/number</text>
<text x="20" y="133" font-size="10" fill="#5b2a86">using the real catalog as reference</text>
<rect x="10" y="150" width="230" height="92" rx="8" fill="#e6f4ee" stroke="#2a8f6a"/>
<text x="20" y="169" font-size="12" font-weight="700" fill="#1f6b50">Here classic software computes:</text>
<text x="20" y="187" font-size="11.5">• Draft from order history</text>
<text x="20" y="203" font-size="11.5">• Product recommendations</text>
<text x="20" y="219" font-size="11.5">• Plausibility check</text>
<text x="20" y="235" font-size="11.5">• Copy last order</text>
</g>

<g transform="translate(830,45)">
<rect width="125" height="250" rx="12" fill="#e6f4ee" stroke="#2a8f6a" stroke-width="2"/>
<rect width="125" height="38" rx="12" fill="#2a8f6a"/><rect y="20" width="125" height="18" fill="#2a8f6a"/>
<text x="62" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5 · Safeguard</text>
<text x="62" y="70" font-size="34" text-anchor="middle">🛡️</text>
<text x="62" y="108" font-size="11.5" text-anchor="middle">Product IDs are</text>
<text x="62" y="123" font-size="11.5" text-anchor="middle">checked against</text>
<text x="62" y="138" font-size="11.5" text-anchor="middle">the catalog, prices</text>
<text x="62" y="153" font-size="11.5" text-anchor="middle">from master data.</text>
<text x="62" y="190" font-size="11" font-weight="700" fill="#1f6b50" text-anchor="middle">No AI:</text>
<text x="62" y="206" font-size="11" fill="#1f6b50" text-anchor="middle">Numbers come</text>
<text x="62" y="221" font-size="11" fill="#1f6b50" text-anchor="middle">from your data</text>
</g>

<g transform="translate(975,45)">
<rect width="125" height="250" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<rect width="125" height="38" rx="12" fill="#e08a00"/><rect y="20" width="125" height="18" fill="#e08a00"/>
<text x="62" y="25" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6 · Decide</text>
<text x="62" y="70" font-size="34" text-anchor="middle">✅</text>
<text x="62" y="108" font-size="11.5" text-anchor="middle">The human reviews</text>
<text x="62" y="123" font-size="11.5" text-anchor="middle">the draft and</text>
<text x="62" y="138" font-size="11.5" text-anchor="middle">clicks</text>
<text x="62" y="153" font-size="11.5" font-weight="700" text-anchor="middle">“Create Order”.</text>
<text x="62" y="190" font-size="11" fill="#7a5a10" text-anchor="middle">Only then is the order</text>
<text x="62" y="206" font-size="11" fill="#7a5a10" text-anchor="middle">created in SAP Sales Cloud</text>
</g>

<path d="M160 170 L183 170" stroke="#6a6180" stroke-width="3" marker-end="url(#k)"/>
<path d="M345 170 L368 170" stroke="#6a6180" stroke-width="3" marker-end="url(#k)"/>
<path d="M530 170 L553 170" stroke="#6a6180" stroke-width="3" marker-end="url(#k)"/>
<path d="M805 170 L828 170" stroke="#6a6180" stroke-width="3" marker-end="url(#k)"/>
<path d="M955 170 L973 170" stroke="#6a6180" stroke-width="3" marker-end="url(#k)"/>

<!-- Rückweg: Antwort vorlesen -->
<path d="M680 295 L680 335 L650 335" stroke="#8E44AD" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
<path d="M290 335 L80 335 L80 299" stroke="#8E44AD" stroke-width="3" fill="none" stroke-dasharray="7 4" marker-end="url(#p)"/>
<rect x="290" y="315" width="360" height="40" rx="10" fill="#f4e9fa" stroke="#8E44AD"/>
<text x="470" y="331" font-size="12.5" font-weight="700" fill="#5b2a86" text-anchor="middle">PICO answers by voice (AI: text → speech)</text>
<text x="470" y="347" font-size="11" fill="#5b2a86" text-anchor="middle">only reads out the finished text, adds nothing</text>

<g transform="translate(0,385)">
<rect width="355" height="150" rx="12" fill="#f4e9fa" stroke="#8E44AD"/>
<text x="16" y="28" font-size="14" font-weight="700" fill="#5b2a86">What the AI does</text>
<text x="16" y="54" font-size="12.5">✔ Turn speech into text</text>
<text x="16" y="76" font-size="12.5">✔ Understand what is meant</text>
<text x="16" y="98" font-size="12.5">✔ Recognize products, quantities, customers</text>
<text x="16" y="120" font-size="12.5">✔ Ask friendly follow-up questions</text>
<text x="16" y="142" font-size="12.5">✔ Read answers aloud naturally</text>
</g>
<g transform="translate(372,385)">
<rect width="355" height="150" rx="12" fill="#e6f4ee" stroke="#2a8f6a"/>
<text x="16" y="28" font-size="14" font-weight="700" fill="#1f6b50">What classic software does</text>
<text x="16" y="54" font-size="12.5">✔ Customers, products, prices from SAP Sales Cloud</text>
<text x="16" y="76" font-size="12.5">✔ Drafts &amp; recommendations from history</text>
<text x="16" y="98" font-size="12.5">✔ Plausibility check of line items</text>
<text x="16" y="120" font-size="12.5">✔ Verify all AI results against master data</text>
<text x="16" y="142" font-size="12.5">✔ Login &amp; authorizations (SAP BTP)</text>
</g>
<g transform="translate(745,385)">
<rect width="355" height="150" rx="12" fill="#fff4e0" stroke="#e08a00"/>
<text x="16" y="28" font-size="14" font-weight="700" fill="#7a5a10">What stays with the human</text>
<text x="16" y="54" font-size="12.5">✔ Orders are never created automatically</text>
<text x="16" y="76" font-size="12.5">✔ AI results only land in the draft</text>
<text x="16" y="98" font-size="12.5">✔ Review, change, confirm</text>
<text x="16" y="120" font-size="12.5">✔ Exactly one function per command</text>
<text x="16" y="142" font-size="12.5">✔ The AI never invents products or prices</text>
</g>

<!-- Ausblick -->
<g transform="translate(0,550)">
<rect width="1100" height="58" rx="12" fill="url(#gr)"/>
<defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#5b2a86"/><stop offset="1" stop-color="#8E44AD"/></linearGradient></defs>
<text x="20" y="25" font-size="14" font-weight="700" fill="#fff">🗣 Outlook: fully voice-controllable</text>
<text x="20" y="45" font-size="12" fill="#fff">The showcase can be extended step by step so that the entire flow – from selecting the customer to the final confirmation – is driven by voice alone.</text>
</g>
</svg>
